<div class="chatbot-shell">
   <button type="button" class="chat-toggle" (click)="toggleChat()" aria-label="Open chatbot assistant">
      <span>💬</span>
   </button>

   <div class="chat-backdrop" *ngIf="isOpen" (click)="closeChat()"></div>

   <aside class="chat-panel" [class.open]="isOpen" role="dialog" aria-label="Chatbot assistant">
      <div class="chat-header">
         <div>
            <h3>Invoice Assistant</h3>
            <p>Ask anything about invoices and monitoring</p>
         </div>
         <button type="button" class="close-btn" (click)="closeChat()" aria-label="Close chatbot">✕</button>
      </div>

      <div class="chat-body">
         <div *ngFor="let item of data" class="chat-row">
            <div *ngIf="item.user" class="bubble user">
               {{ item.user }}
            </div>
            <div *ngIf="item.bod" class="bubble bot">
               {{ item.bod }}
            </div>
         </div>
      </div>

      <div class="chat-footer">
         <ng-container *ngIf="!hasBotReply; else chatInputFooter">
            <button type="button" [disabled]="isBuzy" (click)="onClick('Tell me the status of invoices today')">
               <span *ngIf="isBuzy" class="busy-indicator" aria-hidden="true"></span>
               <span>{{ isBuzy ? 'Working...' : 'Tell me the status of invoices today' }}</span>
            </button>
         </ng-container>

         <ng-template #chatInputFooter>
            <input type="text" placeholder="Type your message..." [(ngModel)]="draftMessage" />
            <button type="button" [disabled]="isBuzy || !draftMessage?.trim()" (click)="sendDraftMessage()">
               <span *ngIf="isBuzy" class="busy-indicator" aria-hidden="true"></span>
               <span>{{ isBuzy ? 'Working...' : 'Send' }}</span>
            </button>
         </ng-template>
      </div>
   </aside>
</div>
