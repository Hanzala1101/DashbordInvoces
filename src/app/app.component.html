<soho-icons-new></soho-icons-new>
<soho-icons-empty-new></soho-icons-empty-new>
<header class="header is-personalizable">
  <div class="toolbar" style="display: flex; align-items: center">
    <div
      class="title"
      style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px"
    >
      <h1>Invoice Monitoring Dashboard</h1>
    </div>

    <div style="flex: 1 1 auto"></div>

    <div
      class="toolbar-right"
      style="display: flex; align-items: center; gap: 12px"
    >
      <div class="buttonset">
        <label for="header-searchfield" class="audible">Search</label>
        <input
          id="header-searchfield"
          class="searchfield"
          name="header-searchfield"
        />
      </div>

      <div class="more">
        <button id="btn-more" class="btn-actions" type="button">
          <svg
            class="icon"
            focusable="false"
            aria-hidden="true"
            role="presentation"
          >
            <use href="#icon-more"></use>
          </svg>
          <span class="audible" data-translate="text">More</span>
        </button>
      </div>

      <button type="button" class="btn-actions" (click)="refreshData()">
        <svg
            class="icon"
            focusable="false"
            aria-hidden="true"
            role="presentation"
          >
            <use href="#icon-refresh"></use>
          </svg>
      </button>

      <div class="date-picker" style="display: flex; align-items: center">
        <label for="header-date" class="audible">Select date</label>
        <input
          id="header-date"
          type="date"
          [value]="selectedDateInput"
          (change)="onDateChange($event)"
        />
      </div>
    </div>
  </div>
</header>
<div class="Small fluid-grid">
  <app-monitoring></app-monitoring>
</div>
<div class="version">{{ version }}</div>
